[project]
name = "pygent"
version = "2.0.0rc1"
description = "A small Python agent harness with explicit tools, execution limits, approvals and offline testing."
readme = "README.md"
authors = [ { name = "Mariano Chaves", email = "mchaves.software@gmail.com" } ]
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "agents", "harness", "tools", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.7.0",
    "jsonschema>=4.18",
    "openai>=1.0.0",
    "tomli; python_version < '3.11'",
    "typer>=0.9.0",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110"]
dev = ["ruff>=0.9", "build", "twine"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]
docker = ["docker>=7.0.0"]
ui = ["gradio"]
server = ["fastapi", "uvicorn"]

[project.urls]
Documentation = "https://pygent-ai.com"
Repository = "https://github.com/marianochaves/pygent"

[project.scripts]
pygent = "pygent.cli:main"
pygent-ui = "pygent.ui:main"


[tool.setuptools.package-data]
"pygent" = ["py.typed"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pygent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the default image"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
