name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -m 'not docker'
      - run: python examples/offline_harness.py
      - run: python examples/workspace_harness.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs,dev]'
      - run: python -m ruff check pygent tests
      - run: python -m mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              names = wheel.namelist()
              assert 'pygent/py.typed' in names
              assert 'pygent/harness.py' in names
              assert not any(name.startswith(('tests/', 'examples/', 'docs/')) for name in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,docker]'
      - run: docker pull python:3.12-slim
      - run: python -m pytest -q -m docker
        env:
          PYGENT_TEST_DOCKER: '1'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, quality, docker]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygent
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    if: github.ref == 'refs/heads/main'
    needs: [test, quality, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[docs]'
      - run: python -m mkdocs build --strict
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
